<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Winter.дисплей — Плеер</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: #000000;
            cursor: none;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #stage img,
        #stage video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #stage img.active,
        #stage video.active {
            opacity: 1;
        }

        #empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            color: #666666;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        #empty img {
            width: 40px;
            height: 40px;
            opacity: 0.5;
            position: static;
        }

        #empty p {
            margin: 0;
            font-size: 14px;
        }

        #badge {
            position: fixed;
            left: 18px;
            bottom: 16px;
            display: none;
            align-items: center;
            gap: 7px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(211, 51, 51, 0.14);
            border: 1px solid rgba(211, 51, 51, 0.35);
            color: #ff8080;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            z-index: 10;
        }

        #badge.visible { display: flex; }

        #badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
    </style>
</head>
<body>
    <div id="stage"></div>

    <div id="empty" style="display:none;">
        <img src="../assets/favicon.png" alt="">
        <p>Нет контента для показа</p>
    </div>

    <div id="badge">
        <span class="dot"></span>
        <span>Автономный режим — показываю сохранённый контент</span>
    </div>

    <script src="player.js"></script>
</body>
</html>
