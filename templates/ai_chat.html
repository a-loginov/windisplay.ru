<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter.дисплей: Комета</title>
    <link rel="icon" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 20px;
            line-height: 1;
            vertical-align: middle;
            user-select: none;
        }

        body {
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0c;
            color: #ffffff;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: -20%;
            left: 50%;
            width: 140%;
            height: 60%;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0) 65%);
            pointer-events: none;
            z-index: 0;
        }

        .layout {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- header ---------- */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(20, 20, 24, 0.55);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .nav-back:hover { background: rgba(255, 255, 255, 0.14); }
        .nav-back svg { width: 17px; height: 17px; }

        .top-bar__mark { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .top-bar__title { font-size: 15px; font-weight: 700; line-height: 1.2; }
        .top-bar__status { font-size: 12px; color: rgba(255, 255, 255, 0.55); display: flex; align-items: center; gap: 5px; }
        .top-bar__status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3ddc72; }

        /* ---------- thread ---------- */
        .thread {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 16px;
            scroll-behavior: smooth;
        }

        .thread::-webkit-scrollbar { width: 6px; }
        .thread::-webkit-scrollbar-track { background: transparent; }
        .thread::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

        .thread__inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .empty-hint {
            margin: 10vh auto 0;
            text-align: center;
            max-width: 320px;
            color: rgba(255, 255, 255, 0.55);
        }

        .empty-hint .mark {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            margin: 0 auto 16px;
            object-fit: cover;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .empty-hint h2 { font-size: 17px; color: #ffffff; margin: 0 0 6px; font-weight: 700; }
        .empty-hint p { font-size: 13.5px; margin: 0; line-height: 1.55; }

        .message-row { display: flex; align-items: flex-end; gap: 10px; animation: fadeInUp 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }
        .message-row.user { flex-direction: row-reverse; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.6);
        }

        .message-col { display: flex; flex-direction: column; gap: 4px; max-width: 74%; }
        .message-row.user .message-col { align-items: flex-end; }

        .bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-row.assistant .bubble {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(22px) saturate(150%);
            -webkit-backdrop-filter: blur(22px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-bottom-left-radius: 6px;
        }

        .message-row.user .bubble {
            background: #ffffff;
            color: #0a0a0c;
            border-bottom-right-radius: 6px;
        }

        .bubble--error {
            background: rgba(211, 51, 51, 0.16) !important;
            border-color: rgba(211, 51, 51, 0.35) !important;
            color: #ff9a9a !important;
        }

        .message-time { font-size: 11px; color: rgba(255, 255, 255, 0.35); padding: 0 4px; }

        .bubble--typing { display: flex; align-items: center; gap: 5px; padding: 15px 16px; }
        .bubble--typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: typingDot 1.1s ease-in-out infinite;
        }
        .bubble--typing span:nth-child(2) { animation-delay: 0.15s; }
        .bubble--typing span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-3px); opacity: 1; }
        }

        /* ---------- composer ---------- */
        .composer {
            flex-shrink: 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            background: rgba(20, 20, 24, 0.6);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .composer__inner { max-width: 680px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }

        .composer textarea {
            flex: 1;
            resize: none;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 22px;
            padding: 13px 18px;
            font-size: 15px;
            font-family: inherit;
            color: #ffffff;
            outline: none;
            max-height: 140px;
            line-height: 1.4;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .composer textarea::placeholder { color: rgba(255, 255, 255, 0.4); }
        .composer textarea:focus-visible { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.09); }

        .composer__send {
            appearance: none;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #ffffff;
            color: #0a0a0c;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.15s ease, transform 0.12s ease;
        }

        .composer__send:hover { opacity: 0.85; }
        .composer__send:active { transform: scale(0.96); }
        .composer__send:disabled { opacity: 0.25; cursor: not-allowed; }
        .composer__send svg { width: 18px; height: 18px; }
        .composer__send:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <header class="top-bar">
            <a href="/admin" class="nav-back" aria-label="В админ-панель">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </a>
            <img class="top-bar__mark" src="/static/favicon.png" alt="">
            <div>
                <div class="top-bar__title">Комета</div>
                <div class="top-bar__status">на связи</div>
            </div>
        </header>

        <main class="thread" id="thread">
            <div class="empty-hint" id="emptyHint">
                <img class="mark" src="/static/favicon.png" alt="">
                <h2>Спросите что-нибудь у Кометы</h2>
                <p>Помогу разобраться с пользователями, экранами и медиа во всей системе Winter.дисплей</p>
            </div>
            <div class="thread__inner" id="threadInner"></div>
        </main>

        <div class="composer">
            <div class="composer__inner">
                <textarea id="composerInput" rows="1" placeholder="Написать Комете…"></textarea>
                <button class="composer__send" id="sendBtn" aria-label="Отправить" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const thread = document.getElementById("thread");
        const threadInner = document.getElementById("threadInner");
        const emptyHint = document.getElementById("emptyHint");
        const composerInput = document.getElementById("composerInput");
        const sendBtn = document.getElementById("sendBtn");

        let history = [];
        let typingRow = null;

        function autoGrow() {
            composerInput.style.height = "auto";
            composerInput.style.height = `${Math.min(composerInput.scrollHeight, 140)}px`;
        }

        function updateSendState() {
            sendBtn.disabled = !composerInput.value.trim();
        }

        composerInput.addEventListener("input", () => {
            autoGrow();
            updateSendState();
        });

        composerInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function scrollToBottom() {
            thread.scrollTop = thread.scrollHeight;
        }

        function formatTime(date) {
            return date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        }

        function addBubble(role, text, extraClass) {
            emptyHint.style.display = "none";

            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const avatarHtml = role === "assistant" ? `<img class="message-avatar" src="/static/favicon.png" alt="">` : "";

            const bubble = document.createElement("div");
            bubble.className = `bubble${extraClass ? " " + extraClass : ""}`;
            bubble.textContent = text;

            const time = document.createElement("span");
            time.className = "message-time";
            time.textContent = formatTime(new Date());

            const col = document.createElement("div");
            col.className = "message-col";
            col.appendChild(bubble);
            col.appendChild(time);

            row.innerHTML = avatarHtml;
            row.appendChild(col);

            threadInner.appendChild(row);
            scrollToBottom();
            return row;
        }

        function showTyping() {
            emptyHint.style.display = "none";
            const row = document.createElement("div");
            row.className = "message-row assistant";
            row.innerHTML = `
                <img class="message-avatar" src="/static/favicon.png" alt="">
                <div class="bubble bubble--typing"><span></span><span></span><span></span></div>
            `;
            threadInner.appendChild(row);
            scrollToBottom();
            typingRow = row;
        }

        function hideTyping() {
            if (typingRow) {
                typingRow.remove();
                typingRow = null;
            }
        }

        async function sendMessage() {
            const text = composerInput.value.trim();
            if (!text) return;

            addBubble("user", text);
            history.push({ role: "user", content: text });

            composerInput.value = "";
            autoGrow();
            updateSendState();
            showTyping();

            try {
                const res = await fetch("/api/ai_chat/send", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history }),
                });
                const data = await res.json();
                hideTyping();

                if (!res.ok || data.error) {
                    addBubble("assistant", "Комета сейчас недоступна. Попробуйте ещё раз чуть позже.", "bubble--error");
                    return;
                }

                addBubble("assistant", data.reply);
                history.push({ role: "assistant", content: data.reply });
            } catch {
                hideTyping();
                addBubble("assistant", "Не удалось связаться с сервером.", "bubble--error");
            }
        }

        sendBtn.addEventListener("click", sendMessage);
    </script>
</body>
</html>
