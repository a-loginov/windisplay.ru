# Конфигурация nginx для panel.windisplay.ru
# Копируется deploy.sh в /etc/nginx/conf.d/panel.windisplay.ru.conf
# HTTPS/редирект-блоки добавляются автоматически скриптом certbot
# (запускается в deploy.sh), поэтому здесь только HTTP-сервер.

server {
    listen 80;
    listen [::]:80;
    server_name panel.windisplay.ru;

    # Адрес приложения (gunicorn)
    location / {
        proxy_pass http://127.0.0.1:9019;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /opt/windisplay/static/;
        expires 30d;
    }
}
